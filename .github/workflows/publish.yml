name: publish

# Publishes to npm via OIDC trusted publishing -- no NPM_TOKEN secret exists.
#
# The trust is configured once on npmjs.com (package Settings -> Trusted
# Publisher -> GitHub Actions) and must name this file exactly:
#
#   Organization or user : ZYFsir
#   Repository           : pi-net-resume
#   Workflow filename    : publish.yml
#   Environment name     : (leave empty -- this workflow sets no environment)
#
# Requirements this file has to satisfy (see docs.npmjs.com/trusted-publishers):
#   * `id-token: write` so the runner can mint the OIDC token
#   * npm >= 11.5.1 and Node >= 22.14.0 -- the runner's bundled npm is older,
#     hence the explicit upgrade step below
#   * only GitHub-hosted runners; self-hosted is not supported
#
# Triggers on a version tag, not on every push: npm rejects a version that
# already exists, so "push and hope" would fail on every commit that does not
# bump the version.  Tagging is also what the README tells users to install.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Pack and verify without publishing"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # The runner's npm predates OIDC support; without this the publish fails
      # with an authentication error rather than anything that names OIDC.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          echo "npm $(npm --version)"

      - name: Run the release gate (tests, manifest, load check, tarball)
        run: ./publish-package.sh

      # The tag must agree with the version being published, or the git install
      # documented in the README would point at a different release.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: pkg/pi-net-resume
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg_version" >&2
            exit 1
          fi
          echo "tag and package.json agree on $pkg_version"

      - name: Publish
        working-directory: pkg/pi-net-resume
        run: |
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            npm publish --dry-run
          else
            # Provenance is generated automatically for OIDC publishes from a
            # public repository; --provenance is not needed.
            npm publish --access public
          fi
