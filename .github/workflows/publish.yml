name: publish

# Stages a release on npm via OIDC trusted publishing -- no NPM_TOKEN secret.
#
# STAGED, not direct.  `npm stage publish` uploads to a staging area that only a
# maintainer can approve, with 2FA; nothing reaches the public registry until
# then.  npm recommends this ("leave unchecked to allow staged publishing only"),
# and it matters more than usual here: a pi extension runs with full system
# access, so a bad publish is a supply-chain risk for everyone who installs it.
# The cost is one `npm stage approve <stage-id>` per release.
#
# The npm-side trust must name this file exactly:
#
#   Organization or user : ZYFsir
#   Repository           : pi-net-resume
#   Workflow filename    : publish.yml
#   Environment name     : (leave empty -- this workflow sets no environment)
#   Allowed actions      : staged publishing only (leave the npm publish box
#                          UNCHECKED)
#
# Requirements the runner has to satisfy (docs.npmjs.com/trusted-publishers):
#   * `id-token: write`, so the runner can mint the OIDC token
#   * npm >= 11.15.0 (`npm stage`) and Node >= 22.14.0 -- the runner's bundled
#     npm is older than both, hence the upgrade and the explicit assertion below
#   * GitHub-hosted runners only; self-hosted is not supported
#
# Trigger is a version tag rather than every push: npm rejects a version that
# already exists, so a push-triggered publish would fail on any commit that does
# not bump the version.  Tagging is also what the README tells users to install.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run the gate and stage nothing"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # A stale npm fails here with a plain authentication error that never
      # mentions OIDC or `npm stage`, which is a miserable thing to debug.
      - name: Ensure npm is new enough for OIDC staging
        run: |
          npm install -g npm@latest
          have="$(npm --version)"
          required="11.15.0"
          if [ "$(printf '%s\n%s\n' "$required" "$have" | sort -V | head -1)" != "$required" ]; then
            echo "npm $have is too old; need >= $required for 'npm stage'" >&2
            exit 1
          fi
          echo "npm $have"

      - name: Run the release gate (tests, manifest, load check, tarball)
        run: ./publish-package.sh

      # The tag must agree with the version being staged, or the git install
      # documented in the README would point at a different release.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: pkg/pi-net-resume
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg_version" >&2
            exit 1
          fi
          echo "tag and package.json agree on $pkg_version"

      - name: Stage the release
        working-directory: pkg/pi-net-resume
        run: |
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            npm stage publish --dry-run
          else
            # Provenance is generated automatically for OIDC publishes from a
            # public repository; --provenance is not needed.
            npm stage publish --access public
            echo
            echo "Staged. Approve it with:  npm stage approve <stage-id>"
            echo "Pending stages:"
            npm stage list || true
          fi

      - name: Summary
        if: ${{ !inputs.dry-run }}
        run: |
          {
            echo "### Staged, not published"
            echo
            echo "A maintainer must approve this release with 2FA before it goes live:"
            echo
            echo '```'
            echo "npm stage list                  # find the stage id"
            echo "npm stage view <stage-id>       # inspect the tarball metadata"
            echo "npm stage approve <stage-id>    # publish it (prompts for OTP)"
            echo '```'
            echo
            echo "Or approve it on https://www.npmjs.com/package/pi-net-resume"
            echo
            echo "Nothing is public until then; \`npm stage reject <stage-id>\` discards it."
          } >> "$GITHUB_STEP_SUMMARY"
